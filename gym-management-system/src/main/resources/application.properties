# web
server.port=8080

#阿里百炼平台
langchain4j.community.dashscope.chat-model.api-key=${A_LI_API_KEY}
langchain4j.community.dashscope.chat-model.model-name=qwen-max


#请求和响应日志
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

# 基本数据源配置
spring.datasource.url=jdbc:mysql://localhost:3306/gym_management_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=abc123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 开启 SQL 日志打印
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.gym.pojo



#MongoDB连接配置
spring.data.mongodb.uri=mongodb://localhost:27017/chat_memory_db
# 在 application.properties（Spring Boot）中降低 MongoDB 驱动日志级别
#logging.level.org.mongodb=INFO


#集成阿里通义千问-通用文本向量-v3
langchain4j.community.dashscope.embedding-model.api-key=${A_LI_API_KEY}
langchain4j.community.dashscope.embedding-model.model-name=text-embedding-v3

#集成阿里通义千问-流式输出
langchain4j.community.dashscope.streaming-chat-model.api-key=${A_LI_API_KEY}
langchain4j.community.dashscope.streaming-chat-model.model-name=qwen-plus

pinecone.api-key=${PINECONE_API_KEY}

#启用日志debug级别
.level.root=INFO